name: "Test aarch64  "

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - aarch64_support

jobs:
  basic-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/asterinas:0.16.0-20250910
      options: --device=/dev/kvm --privileged
    strategy:
      matrix:
        id: ['lint', 'compile']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Run basic tests
        uses: ./.github/actions/test
        with:
          auto_test: 'general'
          runs_on: 'ubuntu-latest'
          arch: 'aarch64'

  boot-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/asterinas:0.16.0-20250910
      options: --device=/dev/kvm --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Run boot test
        uses: ./.github/actions/test
        with:
          auto_test: 'boot'
          runs_on: 'ubuntu-latest'
          arch: 'aarch64'
          enable_kvm: 'true'
          smp: '1'
