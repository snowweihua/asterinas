language = "en"
[permissions]
allow = ["Edit", "Bash(cd:*)", "Bash(cat:*)", "Bash(git add:*)", "Bash(git commit:*)", "Bash(cd /home/snow/asterinas && git add -A && git commit -m:*)", "Bash(cd /home/snow/asterinas && docker run:*)", "Bash(curl -s:*)"]
[ui]
show_reasoning = true

[network]
[network.proxy]
type = "socks5"

[agent]
cold_resume_prune = true

[tools]
bash_timeout_seconds = 120
mcp_call_timeout_seconds = 300

[tools.background_jobs]
stalled_warning_seconds = 900


